name: eval

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e ".[dev]"
      - run: python -m ruff check .
      - run: python -m pytest

      # Nhánh từ khoá không cần API key nên chạy được trên mọi PR.
      # Cổng chất lượng: tụt dưới ngưỡng là fail build, giống MIN_RECALL_AT_3
      # trong RagRetrievalQualityTest của bản Java.
      - name: Cổng chất lượng truy hồi (chỉ nhánh từ khoá)
        run: python -m eval.harness --branch lexical --min-recall3 0.85 --min-mrr 0.70
