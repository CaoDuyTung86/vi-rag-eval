name: eval

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e ".[dev]"
      - run: python -m ruff check .
      - run: python -m pytest

      # Nhánh từ khoá không cần API key nên chạy được trên mọi PR. Cổng chất lượng áp theo
      # TỪNG ngôn ngữ (recall@3 >= 0.85, MRR >= 0.70), cho cả hai cấu hình có và không lọc
      # lang — y hệt assertMeetsThresholds trong RagRetrievalQualityTest bên Java.
      - name: Cổng chất lượng truy hồi (nhánh từ khoá)
        run: python -m eval.harness
