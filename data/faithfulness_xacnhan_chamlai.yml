  query: cho tôi hỏi chiều mai tôi có thể bay từ hà nội sang đà nẵng không?
  tra_loi: Chào bạn, hiện tại mình chưa có thông tin về lịch trình các chuyến bay cụ thể giữa Hà Nội và
    Đà Nẵng. Mời bạn truy cập trang tìm kiếm chuyến bay trên hệ thống của VigoTrip để xem danh sách chuyến
    bay, giờ đi và giá vé chi tiết cho ngày mai.
