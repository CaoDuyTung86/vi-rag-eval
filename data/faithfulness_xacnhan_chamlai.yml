- id: c13
  query: web có làm ăn bất chính lưu dữ liệu của khách hàng tụi t rồi ko thèm bảo mật dữ liệu cá nhân
    xong đến lúc có bot quét 24/7 lấy cmn hết thì sao??
  tra_loi: "VigoTrip luôn đặt vấn đề bảo mật thông tin cá nhân của khách hàng lên hàng đầu và tuân thủ\
    \ các tiêu chuẩn an toàn thông tin để bảo vệ dữ liệu. \n\nNếu bạn có bất kỳ thắc mắc cụ thể nào về\
    \ chính sách bảo mật hoặc cần hỗ trợ liên quan đến tài khoản, vui lòng liên hệ trực tiếp với bộ phận\
    \ chăm sóc khách hàng qua thông tin ở cuối trang web để được giải đáp chi tiết."
  chunks_day_du:
  - docId: account-forgot-password
    title: Quên mật khẩu
    content: Khách bấm quên mật khẩu ở màn hình đăng nhập và nhập email đã đăng ký. Hệ thống gửi mã đặt
      lại mật khẩu về email đó. Số lần yêu cầu gửi mã bị giới hạn trong mỗi khoảng thời gian để chống
      lạm dụng.
  - docId: account-not-receiving-code
    title: Không nhận được mã xác thực qua email
    content: Mã xác thực có thể rơi vào hộp thư rác. Khách kiểm tra mục spam và quảng cáo trước. Nếu vẫn
      chưa nhận được, đợi vài phút rồi yêu cầu gửi lại, và kiểm tra kỹ email đã nhập đúng chưa.
  - docId: support-contact
    title: Liên hệ hỗ trợ
    content: Khách cần hỗ trợ trực tiếp có thể gọi tổng đài hoặc liên hệ bộ phận chăm sóc khách hàng qua
      thông tin ở cuối trang web. Khi liên hệ nên cung cấp sẵn mã đơn hàng để được tra cứu nhanh.
  - docId: support-complaint
    title: Khiếu nại về chất lượng dịch vụ
    content: Khiếu nại về chất lượng phục vụ trên hành trình được chuyển tới nhà xe hoặc hãng vận chuyển
      tương ứng. Khách gửi kèm mã đơn hàng, ngày đi và mô tả cụ thể sự việc. Khách cũng có thể để lại
      đánh giá cho chuyến đi đã hoàn thành.
