  tra_loi: Em bé dưới 3 tuổi được miễn phí vé và ngồi cùng người lớn đi kèm, không có ghế riêng. Mỗi người
    lớn chỉ được kèm một em bé dưới 2 tuổi, và khách vẫn cần khai báo thông tin em bé khi đặt vé.
  chunks_day_du:
  - docId: children-infant-free
    title: Vé cho em bé dưới 2 tuổi
    content: Em bé dưới 2 tuổi được miễn phí vé và ngồi cùng người lớn đi kèm, không có ghế riêng. Mỗi
      người lớn chỉ được kèm một em bé dưới 2 tuổi. Khách vẫn cần khai báo thông tin em bé khi đặt vé.
  - docId: children-over-12
    title: Trẻ trên 12 tuổi tính vé thế nào
    content: Hành khách từ 12 tuổi trở lên tính giá vé người lớn đầy đủ, không còn được giảm theo diện
      trẻ em.
  - docId: children-2-to-12
    title: Vé trẻ em từ 2 đến 12 tuổi
    content: Trẻ em từ 2 đến 12 tuổi được tính 75 phần trăm giá vé người lớn và có ghế ngồi riêng. Khi
      đặt vé, khách chọn loại hành khách là trẻ em để hệ thống áp dụng đúng mức giá.
  - docId: children-travel-alone
    title: Trẻ em đi một mình
    content: Trẻ em dưới 12 tuổi cần có người lớn đi kèm. Trường hợp trẻ đi một mình, khách phải liên
      hệ trực tiếp nhà xe hoặc hãng để đăng ký dịch vụ trông giữ trẻ trong hành trình, hệ thống đặt vé
      trực tuyến không tự xử lý trường hợp này.
