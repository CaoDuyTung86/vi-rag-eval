- id: c08
  query: tôi muốn mang laptop và máy ảnh theo
  tra_loi: Đối với đồ dễ vỡ và thiết bị điện tử như laptop và máy ảnh, bạn nên mang theo người hoặc để
    trong hành lý xách tay, không nên để trong hành lý ký gửi hay khoang gầm xe. Hành khách bắt buộc phải
    xuất trình căn cước công dân gắn chip khi làm thủ tục gửi đồ. Các nhà vận chuyển sẽ không chịu trách
    nhiệm đối với tài sản có giá trị để trong hành lý ký gửi.
  chunks_day_du:
  - docId: baggage-fragile
    title: Mang đồ dễ vỡ và đồ có giá trị
    content: Đồ dễ vỡ, thiết bị điện tử, tiền mặt và giấy tờ tùy thân nên mang theo người, không để trong
      hành lý ký gửi hay khoang gầm xe. Nhà vận chuyển không chịu trách nhiệm với tài sản có giá trị để
      trong hành lý ký gửi.
  - docId: baggage-plane-general
    title: Quy định hành lý máy bay
    content: Vé máy bay tiêu chuẩn bao gồm 7kg hành lý xách tay và 20kg hành lý ký gửi. Hành lý xách tay
      phải để vừa ngăn hành lý phía trên hoặc dưới ghế ngồi. Nếu hành lý vượt số cân cho phép, khách phải
      mua thêm gói hành lý tại quầy hoặc trả phí quá cân theo biểu giá của hãng.
  - docId: baggage-prohibited
    title: Đồ vật bị cấm mang theo
    content: Không được mang chất cháy nổ, vũ khí, hóa chất độc hại, pháo, bật lửa số lượng lớn và hàng
      cấm lên mọi phương tiện. Với máy bay, chất lỏng xách tay bị giới hạn dung tích theo quy định an
      ninh hàng không. Vi phạm sẽ bị từ chối vận chuyển và không được hoàn tiền.
  - docId: baggage-bus-general
    title: Quy định hành lý xe khách
    content: Vé xe khách được miễn phí tối đa 20kg hành lý cho mỗi hành khách. Hành lý cồng kềnh để ở
      khoang dưới gầm xe, hành lý nhỏ mang theo lên ghế. Không tính thêm phí nếu tổng hành lý nằm trong
      định mức 20kg.
  # bia = có ý chunks không đỡ | co_can_cu = đúng ý khách hỏi
  # tu_choi_thua = chunks có sẵn mà bot không dùng | tu_choi_dung = chunks không có
  nhan_tay: bia
  chac_chan: cao
  ghi_chu: nói đúng ý nhưng thừa đoạn "bắt buộc...", nếu đúng mà thừa vẫn đúng thì oke nhỉ, nhưng tôi
    sẽ ko sửa lại câu 1  || SỬA 17/09 -> bia. "bắt buộc xuất trình căn cước công dân gắn chip khi làm
    thủ tục gửi đồ" không có trong chunk nào. Thiếu sót không phải bịa, nhưng THÊM thì là bịa. Chính khẳng
    định này đã được chấm bia ở c01 trong cùng lần chấm.
- id: c09
  query: Có chính sách giảm giá cho sinh viên không?
  tra_loi: Hiện tại mình chưa có thông tin về chính sách giảm giá dành riêng cho sinh viên trên hệ thống
    VigoTrip. Mời bạn tham khảo các chương trình ưu đãi hoặc mã giảm giá chung hiện có trên trang chủ
    của chúng tôi.
  chunks_day_du:
  - docId: voucher-how-to-use
    title: Cách dùng mã giảm giá
    content: Khách nhập mã giảm giá ở bước thanh toán, trước khi xác nhận đơn hàng. Hệ thống sẽ kiểm tra
      điều kiện áp dụng và trừ trực tiếp vào tổng tiền. Mỗi đơn hàng chỉ áp dụng được một mã giảm giá.
  - docId: voucher-conditions
    title: Điều kiện áp dụng mã giảm giá
    content: Mã giảm giá có thể kèm điều kiện về giá trị đơn tối thiểu, mức giảm tối đa, thời hạn sử dụng
      và số lượt dùng còn lại. Mã hết hạn, hết lượt hoặc đơn chưa đạt giá trị tối thiểu sẽ không áp dụng
      được.
  - docId: children-2-to-12
    title: Vé trẻ em từ 2 đến 12 tuổi
    content: Trẻ em từ 2 đến 12 tuổi được tính 75 phần trăm giá vé người lớn và có ghế ngồi riêng. Khi
      đặt vé, khách chọn loại hành khách là trẻ em để hệ thống áp dụng đúng mức giá.
  - docId: voucher-not-working
    title: Mã giảm giá báo không hợp lệ
    content: Mã báo không hợp lệ thường do đã hết hạn, đã dùng hết lượt, đơn hàng chưa đạt giá trị tối
      thiểu, hoặc mã chỉ áp dụng cho một nhà xe cụ thể. Khách kiểm tra lại điều kiện của mã hoặc chọn
      mã khác đang còn hiệu lực.
  # bia = có ý chunks không đỡ | co_can_cu = đúng ý khách hỏi
  # tu_choi_thua = chunks có sẵn mà bot không dùng | tu_choi_dung = chunks không có
  nhan_tay: tu_choi_dung
  chac_chan: cao
  ghi_chu: vì ko có chunk nào liên quan đến sinh viên
- id: c10
  query: huy ve truoc 1 ngay duoc hoan bao nhieu
  tra_loi: Hủy vé trước 2 ngày, tức là trước giờ khởi hành trên 24 giờ, quý khách sẽ được hoàn lại 100%
    tiền vé. Để thực hiện, quý khách vui lòng đăng nhập tài khoản, vào mục Lịch sử đặt vé, chọn đơn hàng
    cần hủy và bấm nút hủy.
  chunks_day_du:
  - docId: refund-partial
    title: Vì sao chỉ được hoàn một phần tiền
    content: Số tiền hoàn phụ thuộc thời điểm hủy so với giờ khởi hành. Hủy trong khoảng 4 đến 24 giờ
      trước giờ đi chịu phí hủy 10 phần trăm, nên khách chỉ nhận lại 90 phần trăm giá trị đơn hàng chứ
      không phải toàn bộ. Phần phí dịch vụ và các dịch vụ bổ sung đã sử dụng có thể không nằm trong khoản
      hoàn.
  - docId: cancel-policy-refund-tiers
    title: Chính sách hủy vé và mức hoàn tiền
    content: Hủy vé trước giờ khởi hành trên 24 giờ được hoàn 100 phần trăm tiền vé. Hủy trong khoảng
      4 đến 24 giờ trước giờ khởi hành chịu phí hủy 10 phần trăm, tức là được hoàn 90 phần trăm giá trị
      đơn hàng. Khi chỉ còn dưới 4 giờ là tới giờ khởi hành thì không hủy và không hoàn được nữa. Vé đã
      soát tại bến cũng không hủy hoàn được, dù còn cách giờ khởi hành bao lâu.
  - docId: cancel-missed-trip
    title: Lỡ chuyến, trễ giờ khởi hành
    content: Khách đến muộn và lỡ chuyến thì không được hoàn tiền, vì hạn chót hủy vé đã đóng từ lúc còn
      4 giờ trước giờ khởi hành. Vé đã soát cũng không hoàn được. Nếu biết trước mình không đi được, hãy
      chủ động hủy vé càng sớm càng tốt để hưởng mức hoàn tiền cao hơn. Nên có mặt tại bến trước giờ khởi
      hành ít nhất 30 phút.
  - docId: cancel-how-to
    title: Cách hủy vé đã đặt
    content: Để hủy vé, khách đăng nhập rồi vào mục Lịch sử đặt vé, chọn đơn hàng cần hủy và bấm nút hủy.
      Hệ thống sẽ hiển thị số tiền được hoàn trước khi khách xác nhận. Chỉ chủ tài khoản đã đặt vé mới
      hủy được đơn hàng đó.
  # bia = có ý chunks không đỡ | co_can_cu = đúng ý khách hỏi
  # tu_choi_thua = chunks có sẵn mà bot không dùng | tu_choi_dung = chunks không có
  nhan_tay: bia
  chac_chan: cao
  ghi_chu: tôi chưa hiểu lắm, thay vì nới rộng và làm phức tạp lên thành 2 ngày, tức trên 24h... thì sao
    ko chỉ nói là trên 24h là đc hoàn 100% nhỉ.  || SỬA 17/09 -> bia. Tài liệu đặt ngưỡng "trên 24 giờ",
    bot đặt ngưỡng "2 ngày" — khác con số. Cụm "tức là" khẳng định hai ngưỡng tương đương, mà điều đó
    sai (25 giờ thoả vế sau, không thoả vế trước), và nó trả lời trượt câu khách hỏi là trước 1 ngày.
