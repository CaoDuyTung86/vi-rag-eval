# CHẤM MÙ LẠI — bộ xacnhan, 20 câu, seed 16
# Giải thích đầy đủ: data/HUONG_DAN_CHAM.md
#
# Mỗi câu đi từ trên xuống, khớp ở đâu dừng ở đó:
#
#   1. Bot nói điều gì mà chunks KHÔNG đỡ được?      -> bia
#   2. Bot nói được thứ ĐÚNG Ý khách hỏi?            -> co_can_cu
#   3. Bot không trả lời. Chunks có sẵn câu trả lời?
#        có     -> tu_choi_thua
#        không  -> tu_choi_dung
#
# KHÔNG tính là "bot nói": chào hỏi, xin lỗi, hỏi lại khách, "mình chưa có thông tin",
# "liên hệ tổng đài" chung chung, nhắc lại lời khách vừa nói.
#
# chac_chan: cao / thap. Phân vân cứ ghi thap và nói vì sao ở ghi_chu — câu thap được tính
# riêng chứ không bị vứt. Phân vân nhiều là KẾT QUẢ, không phải bạn chấm kém.
#
# Chấm xong hết mới mở: faithfulness_xacnhan.yml, judge_compare/, faithfulness_xacnhan_dapan.yml, faithfulness_xacnhan_chamlai_map.yml
- id: c01
  query: đi tàu có được mang vali to không
  tra_loi: Vé tàu hỏa cho phép mang theo hành lý cá nhân với trọng lượng dưới 20kg mỗi khách và hành khách
    cần xuất trình căn cước công dân khi làm thủ tục gửi đồ. Hành lý sẽ được để trên giá phía trên chỗ
    ngồi hoặc dưới giường nằm. Đối với hàng hóa có kích thước lớn, bạn cần gửi qua dịch vụ vận chuyển
    riêng của nhà ga. Mời bạn ghé trang chi tiết để xem thêm thông tin.
  chunks_day_du:
  - docId: baggage-train-general
    title: Quy định hành lý tàu hỏa
    content: Vé tàu hỏa cho phép mang theo hành lý cá nhân trong khoang, dưới 20kg mỗi khách. Hành lý
      để trên giá phía trên chỗ ngồi hoặc dưới giường nằm. Hàng hóa kích thước lớn cần gửi qua dịch vụ
      vận chuyển riêng của nhà ga.
  - docId: pets-train
    title: Mang thú cưng lên tàu hỏa
    content: Tàu hỏa chỉ nhận thú cưng khi được nhốt trong lồng kín, gửi ở toa hành lý. Không mang thú
      cưng vào khoang giường nằm hay khoang ghế ngồi. Khách nên liên hệ nhà ga trước ngày đi để nắm quy
      định cụ thể của từng tuyến.
  - docId: baggage-bus-general
    title: Quy định hành lý xe khách
    content: Vé xe khách được miễn phí tối đa 20kg hành lý cho mỗi hành khách. Hành lý cồng kềnh để ở
      khoang dưới gầm xe, hành lý nhỏ mang theo lên ghế. Không tính thêm phí nếu tổng hành lý nằm trong
      định mức 20kg.
  - docId: pets-bus
    title: Mang thú cưng lên xe khách
    content: Xe khách cho phép mang theo thú cưng nhỏ như chó, mèo, cún với điều kiện phải để trong lồng
      chuyên dụng và xếp ở khoang hành lý dưới gầm xe. Không được để thú cưng trên ghế ngồi hoặc thả rông
      trong khoang hành khách.
  # bia = có ý chunks không đỡ | co_can_cu = đúng ý khách hỏi
  # tu_choi_thua = chunks có sẵn mà bot không dùng | tu_choi_dung = chunks không có
  nhan_tay: bia
  chac_chan: cao
  ghi_chu: vali to là hành lý cá nhân, không phải hàng hóa kích thước lớn. Miễn dưới 20kg là được mang
    theo. Nhưng câu trả lời của bot lại nói cần xuất trình căn cước công dân khi làm thủ tục gửi đồ, trong
    khi chunks không nói gì về việc này. Câu trả lời cũng không nhắc đến việc hành lý cồng kềnh để ở khoang
    dưới gầm xe hay hành lý nhỏ mang theo lên ghế, mà chỉ nói chung chung về hành lý cá nhân dưới 20kg.
- id: c02
  query: lấy cho tao 1 ly trà sữa tocotoco, thêm trân châu đường đen, không đá, ít ngọt - à ko thêm 25%
    đường nhá!
  tra_loi: Mình chưa có thông tin về dịch vụ mua kèm và các món ăn như trà sữa. Bạn vui lòng liên hệ tổng
    đài hoặc bộ phận chăm sóc khách hàng qua thông tin ở cuối trang web để được hỗ trợ thêm.
  chunks_day_du:
  - docId: support-complaint
    title: Khiếu nại về chất lượng dịch vụ
    content: Khiếu nại về chất lượng phục vụ trên hành trình được chuyển tới nhà xe hoặc hãng vận chuyển
      tương ứng. Khách gửi kèm mã đơn hàng, ngày đi và mô tả cụ thể sự việc. Khách cũng có thể để lại
      đánh giá cho chuyến đi đã hoàn thành.
  - docId: support-contact
    title: Liên hệ hỗ trợ
    content: Khách cần hỗ trợ trực tiếp có thể gọi tổng đài hoặc liên hệ bộ phận chăm sóc khách hàng qua
      thông tin ở cuối trang web. Khi liên hệ nên cung cấp sẵn mã đơn hàng để được tra cứu nhanh.
  - docId: seat-change-after-payment
    title: Đổi ghế sau khi đã thanh toán
    content: Sau khi thanh toán thành công, ghế đã gán cố định cho vé và không đổi được trên hệ thống.
      Trường hợp cần đổi chỗ, khách liên hệ trực tiếp nhân viên nhà xe trước giờ khởi hành.
  - docId: pets-service-animal
    title: Chó dẫn đường cho người khiếm thị
    content: Chó dẫn đường hỗ trợ người khiếm thị được xem xét riêng, không áp dụng quy định thú cưng
      thông thường. Khách cần báo trước cho nhà vận chuyển và mang theo giấy tờ chứng minh đây là động
      vật hỗ trợ đã qua huấn luyện.
  # bia = có ý chunks không đỡ | co_can_cu = đúng ý khách hỏi
  # tu_choi_thua = chunks có sẵn mà bot không dùng | tu_choi_dung = chunks không có
  nhan_tay: tu_choi_dung
  chac_chan: cao
  ghi_chu: chunks ko có câu trả lời về trà sữa
- id: c03
  query: hành lý quá cân thì tính tiền thế nào
  tra_loi: Hành lý vượt định mức miễn phí sẽ bị tính phí quá cân theo từng kg vượt. Mức phí do từng nhà
    xe, hãng bay quy định và thu trực tiếp tại quầy làm thủ tục. Khách nên cân hành lý trước khi ra bến
    để tránh phát sinh chi phí ngoài dự tính.
  chunks_day_du:
  - docId: baggage-overweight-fee
    title: Hành lý quá cân tính phí thế nào
    content: Hành lý vượt định mức miễn phí sẽ bị tính phí quá cân theo từng kg vượt. Mức phí do từng
      nhà xe, hãng bay quy định và thu trực tiếp tại quầy làm thủ tục. Khách nên cân hành lý trước khi
      ra bến để tránh phát sinh chi phí ngoài dự tính.
  - docId: baggage-plane-general
    title: Quy định hành lý máy bay
    content: Vé máy bay tiêu chuẩn bao gồm 7kg hành lý xách tay và 20kg hành lý ký gửi. Hành lý xách tay
      phải để vừa ngăn hành lý phía trên hoặc dưới ghế ngồi. Nếu hành lý vượt số cân cho phép, khách phải
      mua thêm gói hành lý tại quầy hoặc trả phí quá cân theo biểu giá của hãng.
  - docId: baggage-bus-general
    title: Quy định hành lý xe khách
    content: Vé xe khách được miễn phí tối đa 20kg hành lý cho mỗi hành khách. Hành lý cồng kềnh để ở
      khoang dưới gầm xe, hành lý nhỏ mang theo lên ghế. Không tính thêm phí nếu tổng hành lý nằm trong
      định mức 20kg.
  - docId: baggage-train-general
    title: Quy định hành lý tàu hỏa
    content: Vé tàu hỏa cho phép mang theo hành lý cá nhân trong khoang, dưới 20kg mỗi khách. Hành lý
      để trên giá phía trên chỗ ngồi hoặc dưới giường nằm. Hàng hóa kích thước lớn cần gửi qua dịch vụ
      vận chuyển riêng của nhà ga.
  # bia = có ý chunks không đỡ | co_can_cu = đúng ý khách hỏi
  # tu_choi_thua = chunks có sẵn mà bot không dùng | tu_choi_dung = chunks không có
  nhan_tay: co_can_cu
  chac_chan: cao
  ghi_chu: đúng ngay từ chunk đầu
- id: c04
  query: tôi quên mật khẩu
  tra_loi: Để lấy lại mật khẩu, bạn hãy bấm vào mục quên mật khẩu ở màn hình đăng nhập và nhập email đã
    đăng ký. Hệ thống sẽ gửi mã đặt lại mật khẩu về email của bạn.
  chunks_day_du:
  - docId: account-forgot-password
    title: Quên mật khẩu
    content: Khách bấm quên mật khẩu ở màn hình đăng nhập và nhập email đã đăng ký. Hệ thống gửi mã đặt
      lại mật khẩu về email đó. Số lần yêu cầu gửi mã bị giới hạn trong mỗi khoảng thời gian để chống
      lạm dụng.
  - docId: account-not-receiving-code
    title: Không nhận được mã xác thực qua email
    content: Mã xác thực có thể rơi vào hộp thư rác. Khách kiểm tra mục spam và quảng cáo trước. Nếu vẫn
      chưa nhận được, đợi vài phút rồi yêu cầu gửi lại, và kiểm tra kỹ email đã nhập đúng chưa.
  - docId: account-register
    title: Đăng ký tài khoản
    content: Khách đăng ký bằng email và mật khẩu, hoặc đăng nhập nhanh bằng tài khoản Google. Với cách
      đăng ký bằng email, hệ thống gửi mã xác thực về hộp thư để kích hoạt tài khoản.
  - docId: voucher-after-payment
    title: Quên nhập mã giảm giá trước khi thanh toán
    content: Mã giảm giá phải nhập trước khi xác nhận thanh toán. Đơn hàng đã thanh toán xong thì không
      áp dụng bù mã giảm giá được nữa.
  # bia = có ý chunks không đỡ | co_can_cu = đúng ý khách hỏi
  # tu_choi_thua = chunks có sẵn mà bot không dùng | tu_choi_dung = chunks không có
  nhan_tay: co_can_cu
  chac_chan: cao
  ghi_chu: đúng ngay từ chunk đầu
- id: c05
  query: Sau khi hủy vé, tôi sẽ nhận được hoàn tiền bằng hình thức nào?
  tra_loi: Sau khi yêu cầu hoàn tiền được duyệt, tiền sẽ được chuyển về đúng phương thức thanh toán ban
    đầu của bạn. Thời gian tiền về tài khoản thường từ 3 đến 7 ngày làm việc, tùy thuộc vào ngân hàng
    hoặc ví điện tử xử lý. Bạn có thể theo dõi trạng thái trong mục Lịch sử đặt vé.
  chunks_day_du:
  - docId: cancel-how-to
    title: Cách hủy vé đã đặt
    content: Để hủy vé, khách đăng nhập rồi vào mục Lịch sử đặt vé, chọn đơn hàng cần hủy và bấm nút hủy.
      Hệ thống sẽ hiển thị số tiền được hoàn trước khi khách xác nhận. Chỉ chủ tài khoản đã đặt vé mới
      hủy được đơn hàng đó.
  - docId: cancel-policy-refund-tiers
    title: Chính sách hủy vé và mức hoàn tiền
    content: Hủy vé trước giờ khởi hành trên 24 giờ được hoàn 100 phần trăm tiền vé. Hủy trong khoảng
      4 đến 24 giờ trước giờ khởi hành chịu phí hủy 10 phần trăm, tức là được hoàn 90 phần trăm giá trị
      đơn hàng. Khi chỉ còn dưới 4 giờ là tới giờ khởi hành thì không hủy và không hoàn được nữa. Vé đã
      soát tại bến cũng không hủy hoàn được, dù còn cách giờ khởi hành bao lâu.
  - docId: refund-processing-time
    title: Thời gian nhận lại tiền hoàn
    content: Sau khi yêu cầu hoàn tiền được duyệt, tiền được chuyển về đúng phương thức thanh toán ban
      đầu. Thời gian tiền về tài khoản thường từ 3 đến 7 ngày làm việc, tùy ngân hàng hoặc ví điện tử
      xử lý. Khách theo dõi trạng thái trong mục Lịch sử đặt vé.
  - docId: cancel-change-ticket
    title: Đổi vé sang chuyến khác
    content: Hệ thống hiện chưa hỗ trợ đổi trực tiếp sang chuyến khác. Khách cần hủy vé cũ theo chính
      sách hoàn tiền hiện hành rồi đặt lại vé mới cho chuyến mong muốn.
  # bia = có ý chunks không đỡ | co_can_cu = đúng ý khách hỏi
  # tu_choi_thua = chunks có sẵn mà bot không dùng | tu_choi_dung = chunks không có
  nhan_tay: co_can_cu
  chac_chan: cao
  ghi_chu: chunk 3 đúng
- id: c06
  query: Thẻ của tôi vẫn đang hoạt động nhưng thanh toán thất bại, cần làm gì?
  tra_loi: "Nếu thanh toán thất bại, báo lỗi hoặc bị gián đoạn, đơn hàng của bạn sẽ ở trạng thái chưa\
    \ thanh toán và ghế được giữ trong thời gian ngắn. Bạn có thể vào Lịch sử đặt vé để thanh toán lại,\
    \ hoặc đặt lại đơn mới. \n\nNếu tài khoản đã bị trừ tiền nhưng đơn hàng không thành công, ngân hàng\
    \ sẽ tự động hoàn lại tiền cho bạn."
  chunks_day_du:
  - docId: payment-failed
    title: Thanh toán thất bại phải làm sao
    content: Nếu thanh toán thất bại, báo lỗi hoặc bị gián đoạn, đơn hàng sẽ ở trạng thái chưa thanh toán
      và ghế được giữ trong thời gian ngắn. Khách vào Lịch sử đặt vé để thanh toán lại, hoặc đặt lại đơn
      mới. Tiền bị trừ mà đơn không thành công sẽ được ngân hàng hoàn tự động.
  - docId: voucher-after-payment
    title: Quên nhập mã giảm giá trước khi thanh toán
    content: Mã giảm giá phải nhập trước khi xác nhận thanh toán. Đơn hàng đã thanh toán xong thì không
      áp dụng bù mã giảm giá được nữa.
  - docId: voucher-not-working
    title: Mã giảm giá báo không hợp lệ
    content: Mã báo không hợp lệ thường do đã hết hạn, đã dùng hết lượt, đơn hàng chưa đạt giá trị tối
      thiểu, hoặc mã chỉ áp dụng cho một nhà xe cụ thể. Khách kiểm tra lại điều kiện của mã hoặc chọn
      mã khác đang còn hiệu lực.
  - docId: payment-hold-time
    title: Thời gian giữ chỗ chờ thanh toán
    content: Ghế đã chọn chỉ được giữ trong một khoảng thời gian ngắn để khách hoàn tất thanh toán. Quá
      thời gian này, hệ thống tự động hủy đơn chưa thanh toán và mở lại ghế cho khách khác. Vì vậy nên
      hoàn tất thanh toán ngay sau khi chọn ghế.
  # bia = có ý chunks không đỡ | co_can_cu = đúng ý khách hỏi
  # tu_choi_thua = chunks có sẵn mà bot không dùng | tu_choi_dung = chunks không có
  nhan_tay: co_can_cu
  chac_chan: cao
  ghi_chu: đúng từ chunk 1
- id: c07
  query: đơn hoàn tiền của tôi đang chờ duyệt nghĩa là sao
  tra_loi: Trạng thái đang chờ duyệt nghĩa là nhà xe đang xem xét yêu cầu hoàn tiền của bạn. Bạn vui lòng
    đợi trong giây lát để nhà cung cấp xử lý nhé.
  chunks_day_du:
  - docId: refund-status-meaning
    title: Ý nghĩa các trạng thái hoàn tiền
    content: Yêu cầu hoàn tiền có các trạng thái chính, gồm đang chờ duyệt, đã duyệt và bị từ chối. Đang
      chờ duyệt nghĩa là nhà xe đang xem xét. Đã duyệt nghĩa là tiền đang trên đường về tài khoản. Bị
      từ chối sẽ kèm lý do cụ thể từ nhà cung cấp.
  - docId: refund-processing-time
    title: Thời gian nhận lại tiền hoàn
    content: Sau khi yêu cầu hoàn tiền được duyệt, tiền được chuyển về đúng phương thức thanh toán ban
      đầu. Thời gian tiền về tài khoản thường từ 3 đến 7 ngày làm việc, tùy ngân hàng hoặc ví điện tử
      xử lý. Khách theo dõi trạng thái trong mục Lịch sử đặt vé.
  - docId: payment-failed
    title: Thanh toán thất bại phải làm sao
    content: Nếu thanh toán thất bại, báo lỗi hoặc bị gián đoạn, đơn hàng sẽ ở trạng thái chưa thanh toán
      và ghế được giữ trong thời gian ngắn. Khách vào Lịch sử đặt vé để thanh toán lại, hoặc đặt lại đơn
      mới. Tiền bị trừ mà đơn không thành công sẽ được ngân hàng hoàn tự động.
  - docId: trip-delay
    title: Chuyến bị hoãn hoặc đổi giờ
    content: Khi chuyến bị hoãn hoặc đổi giờ, hệ thống sẽ thông báo tới email đã đăng ký. Khách nên kiểm
      tra lại trạng thái chuyến trong Lịch sử đặt vé trước khi ra bến. Trường hợp nhà xe hủy chuyến, khách
      được hoàn tiền theo quy định của nhà cung cấp.
  # bia = có ý chunks không đỡ | co_can_cu = đúng ý khách hỏi
