  query: Sau khi hủy vé, tôi có thể nhận lại tiền bằng cách nào?
  tra_loi: Sau khi yêu cầu hoàn tiền được duyệt, tiền sẽ được chuyển về đúng phương thức thanh toán ban
    đầu của bạn. Thời gian tiền về tài khoản thường từ 3 đến 7 ngày làm việc, tùy thuộc vào ngân hàng
    hoặc ví điện tử xử lý. Bạn có thể theo dõi trạng thái hoàn tiền trong mục Lịch sử đặt vé.
