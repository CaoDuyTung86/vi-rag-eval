    title: Mang thú cưng lên máy bay
    content: Máy bay không cho phép mang thú cưng, chó, mèo lên khoang hành khách. Khách có nhu cầu vận
      chuyển thú cưng cần liên hệ trực tiếp hãng hàng không để dùng dịch vụ vận chuyển động vật riêng,
