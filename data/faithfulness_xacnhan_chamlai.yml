    chắc chắn cao giúp tôi :d.
- id: c16
  query: xem lại vé đã mua ở đâu
  tra_loi: Để xem lại vé đã mua, quý khách vui lòng đăng nhập vào tài khoản và truy cập vào mục Lịch sử
    đặt vé. Tại đây, quý khách có thể xem toàn bộ đơn hàng, trạng thái thanh toán, mã QR và chi tiết hành
    trình của mình. Lưu ý rằng bất kỳ người dùng nào cũng có thể xem được vé đã đặt.
  chunks_day_du:
  - docId: booking-check-my-tickets
    title: Xem lại vé đã đặt
    content: Khách đăng nhập rồi vào mục Lịch sử đặt vé để xem toàn bộ đơn hàng, trạng thái thanh toán,
      mã QR và chi tiết hành trình. Chỉ chủ tài khoản mới xem được vé của mình.
  - docId: booking-confirmation-email
    title: Không nhận được email xác nhận vé
    content: Email xác nhận, hay mail vé, thường tới trong vài phút sau khi thanh toán thành công. Nếu
      chưa thấy, khách kiểm tra hộp thư rác và mục quảng cáo. Vé luôn xem được trong mục Lịch sử đặt vé
      của tài khoản, kể cả khi email chưa tới.
  - docId: checkin-already-used
    title: Vé đã check-in rồi có dùng lại được không
    content: Mỗi vé chỉ check-in được một lần. Sau khi đã quét mã thành công, vé chuyển sang trạng thái
      đã sử dụng và không quét lại được, nhằm chống dùng chung hoặc làm giả vé.
  - docId: checkin-qr-usage
    title: Dùng mã QR để lên xe
    content: Mỗi vé có một mã QR riêng. Khi tới bến, khách đưa mã QR trên điện thoại cho nhân viên soát
      vé quét để xác thực. Không cần in vé giấy. Mã QR nằm trong email xác nhận và trong mục Lịch sử đặt
      vé.
