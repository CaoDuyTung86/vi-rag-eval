- id: x05
  nguon: golden
  loai: co_tai_lieu
  cai_bia: doi_so
  tra_loi_goc: Hủy vé trước 1 ngày, tức là trước giờ khởi hành trên 24 giờ, quý khách sẽ được hoàn lại
    100% tiền vé. Để thực hiện, quý khách vui lòng đăng nhập tài khoản, vào mục Lịch sử đặt vé, chọn đơn
    hàng cần hủy và bấm nút hủy.
