- id: x07
  nguon: golden
  loai: co_tai_lieu
  cai_bia: bo_gioi_han
  tra_loi_goc: Nếu bạn chủ động hủy vé trước giờ khởi hành từ 4 đến 24 giờ, mức phí hủy là 10 phần trăm
    giá trị đơn hàng, bạn sẽ nhận lại 90 phần trăm tiền vé. Nếu hủy khi còn dưới 4 giờ hoặc đã lỡ chuyến,
    vé sẽ không được hoàn tiền. Bạn nên chủ động hủy vé sớm nếu không thể tham gia chuyến đi.
- id: x08
  nguon: golden
  loai: co_tai_lieu
  cai_bia: doi_so
  tra_loi_goc: Em bé dưới 2 tuổi được miễn phí vé và ngồi cùng người lớn đi kèm, không có ghế riêng. Mỗi
    người lớn chỉ được kèm một em bé dưới 2 tuổi, và khách vẫn cần khai báo thông tin em bé khi đặt vé.
- id: x09
  nguon: golden
  loai: co_tai_lieu
  cai_bia: them_quy_dinh
  tra_loi_goc: Đối với đồ dễ vỡ và thiết bị điện tử như laptop và máy ảnh, bạn nên mang theo người hoặc
    để trong hành lý xách tay, không nên để trong hành lý ký gửi hay khoang gầm xe. Các nhà vận chuyển
    sẽ không chịu trách nhiệm đối với tài sản có giá trị để trong hành lý ký gửi.
