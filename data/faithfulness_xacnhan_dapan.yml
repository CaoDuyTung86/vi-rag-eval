- id: x02
  nguon: golden
  loai: co_tai_lieu
  cai_bia: them_quy_dinh
  tra_loi_goc: Vé tàu hỏa cho phép mang theo hành lý cá nhân với trọng lượng dưới 20kg mỗi khách. Hành
    lý sẽ được để trên giá phía trên chỗ ngồi hoặc dưới giường nằm. Đối với hàng hóa có kích thước lớn,
    bạn cần gửi qua dịch vụ vận chuyển riêng của nhà ga. Mời bạn ghé trang chi tiết để xem thêm thông
    tin.
