  cai_bia: bo_gioi_han
  tra_loi_goc: Để xem lại vé đã mua, quý khách vui lòng đăng nhập vào tài khoản và truy cập vào mục Lịch
    sử đặt vé. Tại đây, quý khách có thể xem toàn bộ đơn hàng, trạng thái thanh toán, mã QR và chi tiết
    hành trình của mình. Lưu ý rằng chỉ chủ tài khoản mới có thể xem được vé đã đặt.
