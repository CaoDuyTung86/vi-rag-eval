# Bộ câu hỏi vàng để đo chất lượng truy hồi RAG.
#
# Câu hỏi được viết theo cách khách HỎI THẬT, không phải theo cách knowledge base
# VIẾT — cố tình dùng từ khác, viết không dấu, tiếng lóng, sai chính tả. Nếu câu hỏi
# chỉ là bản chép lại của chunk thì bộ đo này vô nghĩa.
#
# expected liệt kê mọi chunk được coi là trả lời đúng: nhiều câu hỏi có hơn một câu
# trả lời hợp lệ, và phạt hệ thống vì chọn chunk đúng "khác" là sai.
#
# lang: ngôn ngữ của CÂU HỎI, bỏ trống thì hiểu là "vi". Bộ đo chấm điểm riêng cho
# từng ngôn ngữ rồi mới gộp, vì một con số trung bình của cả hai sẽ che mất việc một
# ngôn ngữ tụt hẳn.
#
# Câu hỏi tiếng Anh kỳ vọng chunk có hậu tố "-en" và được chấm trên ĐÚNG corpus hỗn
# hợp mà production đang dùng (cả faq-vi.yml lẫn faq-en.yml, chưa lọc theo lang). Đó
# là chủ ý: phải có số của trạng thái hiện tại thì sau này thêm bộ lọc ngôn ngữ vào
# HybridRetriever mới biết là tốt lên hay tệ đi.

- query: cho tôi hỏi được mang bao nhiêu kg lên máy bay
  expected: [baggage-plane-general]

- query: di xe khach mang duoc may can hanh ly
  expected: [baggage-bus-general]

- query: đi tàu có được mang vali to không
  expected: [baggage-train-general, baggage-overweight-fee]

- query: hành lý quá cân thì tính tiền thế nào
  expected: [baggage-overweight-fee]

- query: tôi muốn mang laptop và máy ảnh theo
  expected: [baggage-fragile]

- query: có được mang bật lửa lên xe không
  expected: [baggage-prohibited]

- query: tôi xách theo con poodle nhỏ có sao không
  expected: [pets-bus, pets-plane]

