# Điểm mù còn lại: người viết đã từng thấy golden.yml và tên chunk, nên vẫn nghiêng về cách hỏi
# "khớp" với title. Phần của người thật gõ (bên dưới) để bù điểm mù đó.
#
# Một câu mỗi chunk, 55/56 chunk (bỏ pets-bus vì golden.yml đã có 4 câu về nó). Khoảng 1/3 gõ
