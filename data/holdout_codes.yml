# Câu hỏi có mã voucher, mã đơn, số hiệu chuyến, số ghế — kiểm tra rủi ro trước khi port "Bù BM25".
#
# Knowledge base không chứa mã nào (đã quét cả 4 ngôn ngữ và bản export production 14/09/2026), và
# 39 câu thật trong chat_messages.csv không câu nào gõ mã voucher hay mã đơn. Nên bộ này KHÔNG đo
# được "BM25 bắt mã giỏi" — mã trong câu không khớp chữ nào của chunk. Nó đo điều ngược lại: mã lạ
# có làm nhiễu nhánh nào không, và Bù BM25 có thua RRF ở loại câu này không.
#
# Claude viết 14/09/2026, theo văn phong câu người thật gõ trong holdout.yml (không dấu, viết tắt,
# cáu), trước khi xem tokenizer xử lý mã thế nào. Mã đều bịa, không phải mã thật của hệ thống.
# Không dùng để chọn cấu hình — chỉ để chặn: Bù BM25 thua RRF từ 3 câu P@1 thì chưa port.

