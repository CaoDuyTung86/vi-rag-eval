# Bộ câu mồi cho bài phân loại ý định (tuần 10).
#
# 400 câu, 7 nhãn, viết theo giọng khách hỏi thật chứ không phải giọng tài liệu:
# có dấu lẫn không dấu, sai chính tả, viết tắt, câu cụt hai chữ, câu dài lê thê.
#
# ĐÂY LÀ DỮ LIỆU TỔNG HỢP, KHÔNG PHẢI LOG THẬT. Nhãn đã biết trước theo cấu trúc
# file, nên đừng dùng nó làm bộ test — dùng làm bộ TRAIN. Bộ test phải là câu người
# thật gõ, lấy từ data/private/chat_messages.csv.
#
# Cách dùng nhanh nhất: nạp thẳng file này làm dữ liệu train, KHÔNG cần gõ từng câu
# vào bot. Bộ phân loại chỉ học từ (câu hỏi, nhãn); câu trả lời của bot không tham
# gia vào việc học. Chỉ gõ vào bot những câu bạn muốn xem nó phản ứng thế nào.
#
# Số lượng cố ý lệch nhau để giữ nguyên mất cân bằng lớp giống thực tế.
#
#   chinh_sach       90
#   tim_chuyen       80
#   dat_thanh_toan   60
#   don_cua_toi      45
#   khuyen_mai       45
#   ngoai_pham_vi    45
#   xa_giao          35

