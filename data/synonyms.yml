# Từ đồng nghĩa mở rộng truy vấn cho nhánh BM25, mỗi ngôn ngữ một bảng.
#
# Tham chiếu: SynonymExpander.java — bản Java hard-code bốn bảng này trong mã nguồn. Ở đây
# chúng là DỮ LIỆU: đổi mỗi lần error analysis phát hiện một khoảng trống từ vựng mới, và đổi
# dữ liệu thì không nên phải sửa code.
#
# Vì sao tách bảng theo ngôn ngữ: khi truy hồi lọc theo lang, chỉ mục mà một câu hỏi tiếng Anh
# được chấm trên đó CHỈ còn chunk tiếng Anh. Ném thêm từ khoá tiếng Việt vào truy vấn đó không
# khớp được gì, chỉ làm truy vấn dài ra. Chiều ngược lại cũng vậy.
#
# Cách so khớp (xem rag/synonyms.py):
#   - Khoá Latin: ĐÃ BỎ DẤU, khớp theo RANH GIỚI TỪ trên token của truy vấn — "cho" không được
#     khớp vào "chon" (chọn), "cun" không được khớp vào "cung" (cùng).
#   - Khoá CJK: khớp CHUỖI CON trên truy vấn đã NFKC, vì tiếng Nhật/Trung không có dấu cách.
# Giá trị là các cụm từ ném THÊM vào truy vấn (sẽ được tách token), không thay thế token gốc.
#
# Mọi khoá đặt trong ngoặc kép: YAML 1.1 đọc no/yes/on/off để trần thành bool.

vi:
  # --- thú cưng ---
  "thu cung": [thu cung, cho, meo, pet, dong vat, long]
  "cho": [thu cung, cho]
  "meo": [thu cung, meo]
  "cun": [thu cung, cho]
  "poodle": [thu cung, cho]
  "pet": [thu cung]

  # --- huỷ vé, hoàn tiền ---
  "huy ve": [huy ve, hoan tien, hoan ve]
  "tra ve": [huy ve, hoan tien]
  "bung ve": [huy ve, hoan tien]
  "doi ve": [doi ve, huy ve]
  "hoan tien": [hoan tien, huy ve]
  "lay lai tien": [hoan tien, huy ve]
  "lo chuyen": [huy ve, hoan tien, tre gio]

  # --- hành lý ---
  "hanh ly": [hanh ly, vali, ky gui, xach tay, kg]
  "vali": [hanh ly, vali]
  "xach tay": [hanh ly, xach tay]
  "ky gui": [hanh ly, ky gui]
  "may kg": [hanh ly, kg]
  "may can": [hanh ly, kg]

  # --- trẻ em ---
  "tre em": [tre em, em be, tuoi]
  "em be": [tre em, em be]
  "tre nho": [tre em]

  # --- thanh toán ---
  "thanh toan": [thanh toan, vnpay, the, vi dien tu]
  "chuyen khoan": [thanh toan, vnpay]
  "vnpay": [thanh toan, vnpay]
  "tra tien": [thanh toan]

  # --- khuyến mãi ---
  "khuyen mai": [khuyen mai, voucher, giam gia, uu dai]
  "giam gia": [khuyen mai, voucher, giam gia]
  "voucher": [khuyen mai, voucher]
  "uu dai": [khuyen mai, voucher]
  "re hon": [khuyen mai, giam gia]

  # --- check-in ---
  "check in": [check in, qr, soat ve, len xe]
  "qr": [check in, qr, soat ve]
  "ma vach": [check in, qr, soat ve]
  "soat ve": [check in, qr]

  # --- khoảng trống từ vựng do bộ đo phát hiện: từ khách dùng thật khác hẳn từ trong tài liệu
  "tong dai": [ho tro, lien he, cham soc khach hang]
  "mail": [email]
  "bat lua": [chay no, cam, vu khi]
  "ca nha": [nhieu, hanh khach, so luong]
  "di va ve": [khu hoi]
  "ca hai chieu": [khu hoi]
  "laptop": [de vo, thiet bi dien tu, gia tri]
  "may anh": [de vo, thiet bi dien tu, gia tri]
  "re nhat": [gia, loc, tim chuyen]
  "lan dau": [cac buoc, dat ve]

