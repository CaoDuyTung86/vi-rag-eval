# Từ đồng nghĩa mở rộng truy vấn cho nhánh BM25.
#
# Tách ra khỏi mã nguồn (bản Java hard-code trong SynonymExpander) vì đây là DỮ LIỆU:
# nó thay đổi mỗi lần error analysis phát hiện một khoảng trống từ vựng mới, và
# thay đổi dữ liệu không nên cần biên dịch lại.
#
# Quy tắc: khoá là cụm từ ĐÃ BỎ DẤU, so khớp bằng "chuỗi con" trên truy vấn đã chuẩn hoá.
# Giá trị là các token ném thêm vào truy vấn — không thay thế token gốc, chỉ thêm.

# --- thú cưng ---
"thu cung": [thu cung, cho, meo, pet, dong vat, long]
"cho": [thu cung, cho]
"meo": [thu cung, meo]
"cun": [thu cung, cho]
"poodle": [thu cung, cho]
"pet": [thu cung]

# --- huỷ vé, hoàn tiền ---
"huy ve": [huy ve, hoan tien, hoan ve]
"tra ve": [huy ve, hoan tien]
"bung ve": [huy ve, hoan tien]
"doi ve": [doi ve, huy ve]
"hoan tien": [hoan tien, huy ve]
"lay lai tien": [hoan tien, huy ve]
"lo chuyen": [huy ve, hoan tien, tre gio]

# --- hành lý ---
"hanh ly": [hanh ly, vali, ky gui, xach tay, kg]
"vali": [hanh ly, vali]
"xach tay": [hanh ly, xach tay]
"ky gui": [hanh ly, ky gui]
"may kg": [hanh ly, kg]
"may can": [hanh ly, kg]
"luggage": [hanh ly]
"baggage": [hanh ly]

# --- trẻ em ---
"tre em": [tre em, em be, tuoi]
"em be": [tre em, em be]
"tre nho": [tre em]
"baby": [tre em, em be]

# --- thanh toán ---
"thanh toan": [thanh toan, vnpay, the, vi dien tu]
"chuyen khoan": [thanh toan, vnpay]
"vnpay": [thanh toan, vnpay]
"tra tien": [thanh toan]

# --- khuyến mãi ---
"khuyen mai": [khuyen mai, voucher, giam gia, uu dai]
"giam gia": [khuyen mai, voucher, giam gia]
"voucher": [khuyen mai, voucher]
"uu dai": [khuyen mai, voucher]
"re hon": [khuyen mai, giam gia]

# --- check-in ---
"check in": [check in, qr, soat ve, len xe]
"qr": [check in, qr, soat ve]
"ma vach": [check in, qr, soat ve]
"soat ve": [check in, qr]

# --- khoảng trống từ vựng do bộ đo phát hiện ---
# Từ khách dùng thật khác hẳn từ trong tài liệu. Mỗi dòng dưới đây tương ứng
# một câu hỏi từng trượt trong golden.yml.
"tong dai": [ho tro, lien he, cham soc khach hang]
"mail": [email]
