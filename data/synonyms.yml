ja:
  # Nhỏ hơn hẳn hai bảng trên vì bigram đã tự gánh phần lớn việc: "手荷物" và "荷物" chung
  # bigram 荷物 nên khớp được mà không cần khai báo. Chỉ còn những cặp KHÁC MẶT CHỮ hay bị dùng
  # lẫn: từ ngoại lai katakana so với từ thuần Nhật, cách nói đời thường so với từ tài liệu.
