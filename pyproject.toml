[project]
name = "vi-rag-eval"
version = "0.2.0"
description = "Truy hồi lai đa ngôn ngữ (BM25 + vector + RRF) kèm bộ đo chất lượng"
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6.0",
    "numpy>=1.26",
    "httpx>=0.27",
    # Thuộc tính Unicode Script (\p{Script=Han}...) để nhận diện chữ CJK — thư viện chuẩn
    # của Python không có.
    "regex>=2024.5",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]
export = [
    "psycopg[binary]>=3.1",
]

[project.scripts]
vi-rag-eval = "eval.harness:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["rag", "eval", "learn"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["rag", "eval", "learn"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# learn/ chưa có trong bản cài editable cũ; thêm gốc repo vào sys.path để khỏi phải cài lại.
pythonpath = ["."]
addopts = "-q"
